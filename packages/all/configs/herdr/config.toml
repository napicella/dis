# herdr configuration
# Place this file at ~/.config/herdr/config.toml
# Show first-run notification setup on startup.
# Missing also shows onboarding; set false after you've chosen.
onboarding = false


[theme]
# Built-in themes: catppuccin, terminal, tokyo-night, dracula, nord,
#                  gruvbox, one-dark, solarized, kanagawa, rose-pine,
#                  vesper
# name = "catppuccin"
# Follow host terminal light/dark appearance and switch Herdr UI themes.
# Existing manual behavior is unchanged unless this is true.
# auto_switch = false
# dark_name = "catppuccin"
# light_name = "catppuccin-latte"
# Override individual color tokens on top of the base theme.
# Accepts: hex (#rrggbb), named colors, rgb(r,g,b), or panel_bg = "reset"
# [theme.custom]
# panel_bg = "reset"
# accent = "#f5c2e7"
# red = "#ff6188"
# green = "#a6e3a1"
name = "gruvbox"
auto_switch = false

[terminal]
# Executable used for new interactive panes.
# Empty means $SHELL, then /bin/sh.
# default_shell = ""
# Startup mode for new interactive pane shells: "auto", "login", or "non_login".
# "auto" uses login shells on macOS and keeps the current behavior elsewhere.
# shell_mode = "auto"
# CWD policy for new panes, tabs, and workspaces when no explicit --cwd is provided.
# Use "follow" to inherit the source pane/workspace, "home" for $HOME,
# "current" for Herdr's process directory, or a fixed path such as "~/Projects".
# new_cwd = "follow"
# Update channel used by background version checks and `herdr update`.
# Use "stable" for normal releases or "preview" for opt-in preview builds.
# channel = "stable"
# Check herdr.dev for new Herdr versions in the background.
# version_check = true
# Check herdr.dev for remote agent-detection manifest updates in the background.
# manifest_check = true
default_shell = "/bin/bash"

[update]
[keys]
# Prefix key to enter prefix mode (default: "ctrl+b")
# Examples: "ctrl+b", "f12", "esc", "-"
# Action bindings use explicit syntax: "prefix+n" requires the prefix;
# "ctrl+alt+n" is a direct terminal-mode shortcut.
# Accepted key syntax: plain keys, ctrl/shift/alt/cmd/super modifiers, and special keys like enter/tab/esc/left/right/up/down.
# Named punctuation such as minus, comma, ampersand, plus, and backtick is also accepted.
# Most reliable direct bindings are ctrl+letter, function keys, and explicit modified chords.
# alt+..., cmd/super, and punctuation-with-modifiers may depend on your terminal/tmux setup.
# desc: prefix key that enters prefix mode
# prefix = "ctrl+b"
# Prefix-mode actions
# desc: open keybinding help
# help = "prefix+?"
# desc: open settings
# settings = "prefix+s"
# desc: detach the current client from its Herdr server
# detach = "prefix+q"
# desc: reload config.toml in the running app/server
# reload_config = "prefix+shift+r"
# desc: focus the currently visible notification target
# open_notification_target = "prefix+o"
# desc: open the workspace navigation surface
# workspace_picker = "prefix+w"
# desc: open the session navigator
# goto = "prefix+g"
# desc: move workspace selection up in navigate mode
# navigate_workspace_up = "up"
# desc: move workspace selection down in navigate mode
# navigate_workspace_down = "down"
# desc: focus the pane to the left in navigate mode
# navigate_pane_left = "h"
# desc: focus the pane below in navigate mode
# navigate_pane_down = "j"
# desc: focus the pane above in navigate mode
# navigate_pane_up = "k"
# desc: focus the pane to the right in navigate mode
# navigate_pane_right = "l"
# desc: create a new workspace
# new_workspace = "prefix+shift+n"
# desc: create a Git worktree from the selected workspace
# new_worktree = "prefix+shift+g"
# desc: open an existing Git worktree from the selected workspace
# open_worktree = ""    # optional, unset by default
# desc: delete the selected managed worktree checkout after confirmation
# remove_worktree = ""  # optional, unset by default; opens confirmation
# desc: rename the selected workspace
# rename_workspace = "prefix+shift+w"
# desc: close the selected workspace
# close_workspace = "prefix+shift+d"
# desc: select the previous workspace
# previous_workspace = "" # optional, unset by default
# desc: select the next workspace
next_workspace = "alt+a"
# desc: focus the previous agent shown in the agent panel
# previous_agent = ""     # optional, unset by default
# desc: focus the next agent shown in the agent panel
# next_agent = ""         # optional, unset by default
# desc: focus an agent by index 1-9
# focus_agent = ""        # optional indexed binding, e.g. "prefix+alt+1..9"
# desc: send a clipboard image to a remote Herdr session
# remote_image_paste = "ctrl+v" # only active in herdr --remote; empty disables raw-key image paste
# desc: create a new tab in the active workspace
# new_tab = "prefix+c"
# desc: rename the active tab
# rename_tab = "prefix+shift+t"
# desc: select the previous tab
# previous_tab = "prefix+p"
# desc: select the next tab
next_tab = "alt+s"
# desc: move the active tab one position toward the front
# move_tab_previous = ""   # optional, e.g. "alt+shift+left" moves the tab toward the front
# desc: move the active tab one position toward the back
# move_tab_next = ""       # optional, e.g. "alt+shift+right" moves the tab toward the back
# desc: switch to tab 1-9
# switch_tab = "prefix+1..9"
# desc: switch to workspace 1-9 from prefix mode
# switch_workspace = ""   # optional indexed binding, e.g. "prefix+shift+1..9"
# desc: close the active tab
# close_tab = "prefix+shift+x"
# desc: rename the focused pane
# rename_pane = "prefix+shift+p"
# desc: open the focused pane scrollback in $EDITOR
# edit_scrollback = "prefix+e"
# desc: enter keyboard copy mode for the focused pane
# copy_mode = "prefix+["
# desc: clear the focused pane screen and scrollback
# clear_pane = ""                  # unbound; e.g. "prefix+ctrl+k"
# desc: focus the pane to the left
focus_pane_left = "alt+left"
# desc: focus the pane below
focus_pane_down = "alt+down"
# desc: focus the pane above
focus_pane_up = "alt+up"
# desc: focus the pane to the right
focus_pane_right = "alt+right"
# desc: swap the focused pane with the pane to the left
# swap_pane_left = "prefix+shift+h"
# desc: swap the focused pane with the pane below
# swap_pane_down = "prefix+shift+j"
# desc: swap the focused pane with the pane above
# swap_pane_up = "prefix+shift+k"
# desc: swap the focused pane with the pane to the right
# swap_pane_right = "prefix+shift+l"
# desc: cycle to the next pane
# cycle_pane_next = "prefix+tab"
# desc: cycle to the previous pane
# cycle_pane_previous = "prefix+shift+tab"
# desc: focus the last focused pane across workspaces and tabs
# last_pane = ""          # optional, unset by default; bind e.g. "prefix+tab" for global back-and-forth
# desc: split pane vertically (side by side)
split_vertical = "prefix+|"
# desc: split pane horizontally (stacked)
# split_horizontal = "prefix+minus"
# desc: close the focused pane
# close_pane = "prefix+x"
# desc: toggle zoom for the focused pane
# zoom = "prefix+z"       # legacy alias: fullscreen
# desc: enter resize mode
# resize_mode = "prefix+r"
# desc: resize the focused pane toward the left
# resize_pane_left = ""   # optional, e.g. "ctrl+shift+alt+left" resizes without entering resize mode
# desc: resize the focused pane downward
# resize_pane_down = ""   # optional, e.g. "ctrl+shift+alt+down"
# desc: resize the focused pane upward
# resize_pane_up = ""     # optional, e.g. "ctrl+shift+alt+up"
# desc: resize the focused pane toward the right
# resize_pane_right = ""  # optional, e.g. "ctrl+shift+alt+right"
# desc: toggle sidebar collapse
# toggle_sidebar = "prefix+b"

[[keys.command]]
key = "prefix+t"
type = "pane"
command = "exec bash"
description = "open scratch terminal"

[[keys.command]]
key = "prefix+/"
type = "popup"
command = "bash \"$HOME/.config/herdr/herdr-keys.sh\""
description = "search herdr shortcuts"
width = "70%"
height = "60%"

[ui]
show_agent_labels_on_pane_borders = false
pane_scrollbars = false
pane_outer_borders = true
sidebar_start_collapsed = true
copy_on_select = true
status_indicators = "symbols"

[ui.toast]
# off = disable pop-up notifications
# herdr = show in-app toasts
# terminal = ask the outer terminal to show a desktop notification
# system = ask the OS notification service directly
# delivery = "off"
# delay_seconds = 1
delivery = "herdr"

# position = "bottom-right"
# enabled = true
# position = "bottom-center"
# Play sounds when agents change state in background workspaces
# enabled = true
# Optional custom mp3 sound files. Relative paths are resolved from this config file's directory.
# path = "sounds/notification.mp3"   # one mp3 file for all sound notifications
# done_path = "sounds/done.mp3"      # overrides only finished notifications
# request_path = "sounds/request.mp3" # overrides only needs-attention notifications
# Per-agent overrides: default | on | off
# By default, droid is muted.
# [ui.sound.agents]
# droid = "off"
# Resume supported AI-agent panes into their native conversation sessions after
# a Herdr server restart. Requires official integrations that report session refs.
# resume_agents_on_restore = true
# Whether herdr manages the ssh config used for the `herdr --remote` bridge.
# When true (default), herdr runs the bridge ssh through a generated config that
# includes your ~/.ssh/config first and adds ServerAliveInterval/
# ServerAliveCountMax as a fallback (so any keepalive you set yourself still
# wins) to survive idle network/NAT timeouts. Set false to run plain ssh against
# your ssh config unchanged — this does not force keepalive off, it only stops
# herdr from adding its own.
# manage_ssh_config = true
[ui.toast.herdr]
[ui.toast.clipboard]
[ui.sound]

[ui.sidebar.agents]
rows = [["state_icon", "agent"]]

[session]
[remote]
[experimental]
# Allow launching herdr from inside a herdr-managed pane.
# allow_nested = false
# Experimental local Kitty graphics rendering for attached clients.
# Requires a Kitty graphics-compatible outer terminal.
# kitty_graphics = false
# Save recent pane screen history across full server restarts.
pane_history = false

[advanced]
# While prefix mode is active, temporarily switch the macOS host input
# source to an ASCII-capable keyboard layout so prefix commands register
# even when a CJK IME is active, then restore the previous input source
# when prefix mode exits. macOS only; best-effort. Default: false.
# switch_ascii_input_source_in_prefix = false
# Expose the focused pane's cursor to the outer terminal so macOS input
# methods keep tracking the candidate window when TUIs paint their own
# cursor (Claude Code, pi, codex). Trade-off: extra cursor visible for
# apps that hide it without painting a replacement (vim normal mode, etc.).
# reveal_hidden_cursor_for_cjk_ime = false
# Optional allow-list: only reveal for focused panes whose detected agent
# matches one of these names. Empty means apply to any focused pane.
# If the list contains no valid names, the reveal does not apply.
# Accepted: pi, claude, codex, gemini, cursor, devin, cline, opencode,
# copilot, kimi, kiro, droid, amp, grok, hermes, kilo, qodercli, qoder.
# cjk_ime_agents = []
# Cursor shape rendered when reveal_hidden_cursor_for_cjk_ime is true.
# Values: block, steady_block (default), underline, steady_underline, bar, steady_bar.
# cjk_ime_cursor_shape = "steady_block"
# Maximum scrollback buffer size in bytes retained per pane terminal.
# Matches Ghostty's default scrollback-limit behavior.
# scrollback_limit_bytes = 10000000
